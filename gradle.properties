org.gradle.jvmargs=-Xmx4G
org.gradle.parallel=true
org.gradle.caching=true
# IntelliJ IDEA is not yet fully compatible with the configuration cache:
# https://github.com/FabricMC/fabric-loom/issues/1349
org.gradle.configuration-cache=false

# Minecraft
minecraft_version=26.3
fabric_minecraft_range=~26.3
neoforge_minecraft_range=[26.3,26.4)

# Fabric — https://fabricmc.net/develop
# Loom 1.18 is the line FabricMC builds 26.3 with. It needs Gradle 9.7+ running on Java 25, which is
# why the wrapper is 9.7.1 and gradle/gradle-daemon-jvm.properties pins the daemon.
loom_version=1.18.3
loader_version=0.19.5
modmenu_version=21.0.0

# NeoForge — https://projects.neoforged.net/neoforged/neoforge
moddev_version=2.0.148
neoforge_version=26.3.0.101
neoforge_version_range=[26.3,26.4)

# Mod
mod_id=mcpaintfix
mod_name=MC Paint Fix
mod_version=1.0.0
mod_license=MIT
mod_author=Krypton Dev
mod_homepage=https://modrinth.com/mod/mcpaint-fix
mod_sources=https://github.com/krypt0nmm/mcpaint-fix
maven_group=dev.krypton

# Test
junit_version=5.11.4
