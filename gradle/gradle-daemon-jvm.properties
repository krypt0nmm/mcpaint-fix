# Gradle 9.7 runs on Java 17-26 and Loom 1.18 needs at least 25, so the build pins its daemon to
# Java 25 here instead of using whatever `java` is first on the PATH (27 on the main dev machine,
# which this Gradle does not support). Written by hand: `./gradlew updateDaemonJvm` only works once
# toolchain download repositories are configured, and this build deliberately has none.
toolchainVersion=25
