plugins {
	// The non-remapping Loom plugin. Minecraft 26.x ships unobfuscated, under Mojang's own names, so
	// there is no mappings line and no remapJar: the jar that `jar` builds is the jar players run.
	id 'net.fabricmc.fabric-loom' version "${loom_version}"
}

repositories {
	maven {
		name = 'Terraformers'
		url = 'https://maven.terraformersmc.com/releases'
		content { includeGroup 'com.terraformersmc' }
	}
}

loom {
	mods {
		"${mod_id}" {
			sourceSet sourceSets.main
		}
	}
}

sourceSets {
	test {
		java.srcDir rootProject.file('common/src/test/java')
	}
}

dependencies {
	minecraft "com.mojang:minecraft:${minecraft_version}"
	// Plain implementation, not modImplementation: on 26.x Loom no longer creates the mod*
	// configurations, because there is nothing to remap a mod dependency from or to.
	implementation "net.fabricmc:fabric-loader:${loader_version}"

	// Only for the "Config" button in Mod Menu's mod list. The entrypoint that needs it is never
	// loaded when Mod Menu is absent, so this stays out of the jar and out of the dependency list.
	compileOnly "com.terraformersmc:modmenu:${modmenu_version}"

	testImplementation platform("org.junit:junit-bom:${junit_version}")
	testImplementation 'org.junit.jupiter:junit-jupiter'
	testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

// The canvas decoder only touches text components, so it can be tested without a window or a GL
// context. Everything the tests reach is in common/, compiled here against a real Minecraft.
tasks.named('test', Test) {
	useJUnitPlatform()
	testLogging { events 'failed' }
}
